services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    # No host port — only reachable via nginx within the Docker network.
    expose:
      - "8000"
    volumes:
      - ./data:/data
    environment:
      F1_DATA_DIR: /data
      CORS_ORIGINS: "http://nginx:3000,http://localhost:3000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        # Empty string → browser uses same origin (nginx handles routing).
        NEXT_PUBLIC_API_URL: ""
    expose:
      - "3000"
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "3000:3000"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
