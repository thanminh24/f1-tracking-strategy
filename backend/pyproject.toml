[project]
name = "f1-strategy"
version = "0.1.0"
description = "Local-first F1 viewer: archive, replay engine, telemetry dashboard, RL strategy predictions"
readme = "README.md"
authors = [
    { name = "Than Minh", email = "minhthan189@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.3",
    "fastapi>=0.136.3",
    "fastf1>=3.8.3",
    "pandas>=2.3.3",
    "pyarrow>=24.0.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "uvicorn[standard]>=0.49.0",
]

[project.scripts]
f1-ingest = "f1_strategy.ingestion.cli:main"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "ruff>=0.15.16",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
