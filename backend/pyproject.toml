[project]
name = "f1-strategy"
version = "0.1.0"
description = "Local-first F1 viewer: archive, replay engine, telemetry dashboard, RL strategy predictions"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Than Minh", email = "minhthan189@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.3",
    "fastapi>=0.136.3",
    "fastf1>=3.8.3",
    # <1.3 ceiling comes from stable-baselines3; our env uses only the stable Gym API
    "gymnasium>=1.2",
    "lightgbm>=4.6.0",
    "pandas>=2.3.3",
    "pyarrow>=24.0.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "scikit-learn>=1.9.0",
    "scipy>=1.17.1",
    "stable-baselines3>=2.4",
    "uvicorn[standard]>=0.49.0",
    "httpx>=0.28.1",
    "websockets>=14.0",
]

[project.scripts]
f1-ingest = "f1_strategy.ingestion.cli:main"
f1-build-archive-db = "f1_strategy.archive.build_db:main"
f1-calibrate = "f1_strategy.sim.calibration.cli:main"
f1-train-models = "f1_strategy.strategy.train_models_cli:main"
f1-train-ppo = "f1_strategy.strategy.ppo_agent.train:main"
f1-train-rsrl = "f1_strategy.strategy.rsrl_agent.train:main"
f1-batch-calibrate = "f1_strategy.sim.calibration.cli:batch_main"
f1-model-baseline-report = "f1_strategy.strategy.evaluation.baseline_cli:main"
f1-model-tournament = "f1_strategy.strategy.evaluation.tournament_cli:main"
f1-explain-rsrl = "f1_strategy.strategy.rsrl_agent.explain_cli:main"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.16",
]
asr = [
    "faster-whisper>=1.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
